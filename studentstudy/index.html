<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudentStudy - Your homework reminder and grade tracking companion" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>StudentStudy - Homework Reminder App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0a0a;
        color: #fff;
        min-height: 100vh;
        line-height: 1.6;
        background-image: 
          linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      /* Navbar */
      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 3rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        position: sticky;
        top: 0;
        background: rgba(10,10,10,0.8);
        backdrop-filter: blur(10px);
        z-index: 100;
      }
      .nav-logo {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 1.1rem;
      }
      .nav-logo svg { width: 28px; height: 28px; }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }
      .nav-link {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-size: 0.875rem;
        color: #ccc;
        text-decoration: none;
        transition: background 0.2s, color 0.2s;
      }
      .nav-link:hover { background: rgba(255,255,255,0.08); color: #fff; }
      .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
      .btn {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        text-decoration: none;
      }
      .btn-ghost { background: transparent; color: #ccc; }
      .btn-ghost:hover { color: #fff; }
      .btn-primary {
        background: #fff;
        color: #000;
      }
      .btn-primary:hover { background: #e5e5e5; }
      .btn-outline {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: #fff;
      }
      .btn-outline:hover { background: rgba(255,255,255,0.05); }
      .btn-success {
        background: #22c55e;
        color: #fff;
      }
      .btn-success:hover { background: #16a34a; }

      /* Hero Section */
      .hero {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4rem;
        padding: 5rem 3rem;
        max-width: 1400px;
        margin: 0 auto;
        align-items: center;
        min-height: calc(100vh - 70px);
      }
      .hero-content h1 {
        font-size: 3.5rem;
        font-weight: 600;
        line-height: 1.1;
        margin-bottom: 2rem;
      }
      .hero-features { display: flex; flex-direction: column; gap: 1rem; }
      .feature-item {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .feature-dot {
        width: 8px;
        height: 8px;
        background: #3b82f6;
        border-radius: 2px;
        margin-top: 0.5rem;
        flex-shrink: 0;
      }
      .feature-item.active .feature-dot { background: #fff; }
      .feature-title {
        font-size: 1rem;
        color: #888;
        font-weight: 400;
      }
      .feature-item.active .feature-title { color: #fff; }
      .feature-desc {
        font-size: 0.875rem;
        color: #666;
        margin-top: 0.25rem;
      }

      /* Hero Visual */
      .hero-visual {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .visual-container {
        position: relative;
        width: 100%;
        max-width: 500px;
      }
      .sync-badge {
        position: absolute;
        top: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        color: #888;
        font-family: monospace;
      }
      .sync-dot {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .main-card {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 180px;
        margin-top: 2rem;
      }
      .main-card svg { width: 64px; height: 64px; opacity: 0.8; }
      .floating-cards {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .float-card {
        position: absolute;
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-size: 0.75rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      }
      .float-card.assignments {
        top: 60%;
        left: -10%;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .float-card.grades {
        top: 20%;
        right: -15%;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .float-card.classes {
        bottom: 5%;
        right: 5%;
      }
      .card-label {
        color: #888;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.25rem;
      }
      .card-value { color: #fff; font-weight: 500; }
      .star-rating { color: #fbbf24; }

      /* App View (logged in) */
      .app-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 3rem;
      }
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .user-info {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .user-avatar {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 1rem;
      }
      .user-name { font-weight: 500; }
      .user-email { font-size: 0.875rem; color: #888; }

      .section-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .section-title svg {
        width: 20px;
        height: 20px;
      }
      .section-header {
        margin-bottom: 1rem;
      }
      .section-subtitle {
        font-size: 0.875rem;
        color: #666;
        margin-top: 0.25rem;
      }

      /* Stats Bar */
      .stats-bar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-box {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 1rem 1.25rem;
        text-align: center;
      }
      .stat-number {
        font-size: 1.75rem;
        font-weight: 700;
        color: #fff;
      }
      .stat-number.overdue { color: #ef4444; }
      .stat-number.due-soon { color: #f59e0b; }
      .stat-label-sm {
        font-size: 0.75rem;
        color: #666;
        margin-top: 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Assignments Section */
      .assignments-section {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }
      .add-form-inline {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
        flex-wrap: wrap;
      }
      .add-form-inline .form-input {
        flex: 1;
        min-width: 150px;
      }
      .add-form-inline .btn {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        white-space: nowrap;
      }
      .add-form-inline .btn svg {
        width: 16px;
        height: 16px;
      }
      .assignments-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .assignment-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.25rem;
        background: #0a0a0a;
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 10px;
        transition: all 0.2s;
      }
      .assignment-row:hover {
        border-color: rgba(255,255,255,0.1);
        background: #111;
      }
      .assignment-row.overdue-row {
        border-left: 3px solid #ef4444;
      }
      .assignment-row.due-soon-row {
        border-left: 3px solid #f59e0b;
      }
      .assignment-main {
        flex: 1;
        min-width: 0;
      }
      .assignment-title-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .assignment-title {
        font-weight: 500;
        color: #fff;
      }
      .assignment-class-badge {
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
        background: rgba(59, 130, 246, 0.15);
        color: #3b82f6;
        border-radius: 4px;
        font-weight: 500;
      }
      .assignment-desc {
        font-size: 0.8rem;
        color: #666;
        margin-top: 0.25rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .assignment-right {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-shrink: 0;
      }
      .assignment-due {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.8rem;
        color: #888;
      }
      .assignment-due svg {
        width: 14px;
        height: 14px;
      }
      .assignment-due.overdue { color: #ef4444; }
      .assignment-due.due-soon { color: #f59e0b; }
      .btn-handin {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #22c55e;
        cursor: pointer;
        padding: 0.375rem 0.75rem;
        border-radius: 6px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.75rem;
        font-weight: 500;
        font-family: inherit;
        white-space: nowrap;
      }
      .btn-handin:hover {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.5);
      }
      .btn-handin svg {
        width: 14px;
        height: 14px;
      }
      .btn-delete {
        background: transparent;
        border: none;
        color: #555;
        cursor: pointer;
        padding: 0.375rem;
        border-radius: 6px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-delete:hover {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
      }
      .btn-delete svg {
        width: 16px;
        height: 16px;
      }
      .empty-state-small {
        text-align: center;
        padding: 2rem 1rem;
        color: #666;
        font-size: 0.875rem;
      }

      /* Class Performance Styles */
      .performance-section {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }
      .performance-content {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .overall-card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2rem;
        padding: 1.5rem;
        background: linear-gradient(135deg, #0a0a0a 0%, #151515 100%);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
      }
      .overall-main {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }
      .overall-grade-big {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1;
      }
      .overall-details {
        display: flex;
        flex-direction: column;
      }
      .overall-percent {
        font-size: 1.25rem;
        font-weight: 600;
        color: #fff;
      }
      .overall-info {
        font-size: 0.8rem;
        color: #666;
        margin-top: 0.25rem;
      }
      .grade-breakdown {
        border-left: 1px solid rgba(255,255,255,0.1);
        padding-left: 2rem;
      }
      .breakdown-title {
        font-size: 0.75rem;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.75rem;
      }
      .breakdown-bars {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .breakdown-row {
        display: grid;
        grid-template-columns: 80px 1fr 30px;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.75rem;
      }
      .breakdown-label { color: #888; }
      .breakdown-bar-bg {
        height: 6px;
        background: rgba(255,255,255,0.05);
        border-radius: 3px;
        overflow: hidden;
      }
      .breakdown-bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.3s;
      }
      .breakdown-count {
        color: #666;
        text-align: right;
      }
      .classes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1rem;
      }
      .class-card {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 1.25rem;
        transition: border-color 0.2s;
      }
      .class-card:hover { border-color: rgba(255,255,255,0.2); }
      .class-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      .class-name {
        font-weight: 600;
        font-size: 1.1rem;
      }
      .class-grade {
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .class-details {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 0;
        border-top: 1px solid rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        margin-bottom: 0.75rem;
      }
      .class-stat {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
      }
      .stat-label {
        font-size: 0.75rem;
        color: #666;
      }
      .stat-value {
        font-weight: 600;
        color: #fff;
      }
      .class-trend {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .class-trend svg {
        width: 16px;
        height: 16px;
      }
      .class-trend.up { color: #22c55e; }
      .class-trend.down { color: #ef4444; }
      .class-stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.5rem;
        padding: 0.75rem 0;
        border-top: 1px solid rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        margin-bottom: 0.75rem;
      }
      .mini-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .mini-stat-value {
        font-weight: 600;
        font-size: 0.9rem;
        color: #fff;
      }
      .mini-stat-value.trend-up { color: #22c55e; }
      .mini-stat-value.trend-down { color: #ef4444; }
      .mini-stat-label {
        font-size: 0.65rem;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .recent-grades { margin-top: 0.5rem; }
      .recent-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-size: 0.75rem;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .see-all {
        color: #555;
        font-weight: 400;
        text-transform: none;
      }
      .recent-label {
        font-size: 0.75rem;
        color: #666;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .grades-list {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }
      .grade-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.875rem;
      }
      .grade-name {
        color: #ccc;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 70%;
      }
      .grade-score {
        font-weight: 600;
      }

      .add-form {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 1.5rem;
        margin-top: 1rem;
      }
      .form-row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .form-input {
        flex: 1;
        min-width: 200px;
        padding: 0.75rem 1rem;
        background: #0a0a0a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        color: #fff;
        font-size: 0.875rem;
        font-family: inherit;
      }
      .form-input:focus {
        outline: none;
        border-color: #3b82f6;
      }
      .form-input::placeholder { color: #666; }

      .empty-state {
        text-align: center;
        padding: 3rem;
        color: #888;
      }
      .empty-state svg {
        width: 64px;
        height: 64px;
        margin-bottom: 1rem;
        opacity: 0.5;
      }

      /* Login Form */
      .login-container {
        max-width: 400px;
        margin: 4rem auto;
        padding: 2rem;
      }
      .login-card {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 2rem;
      }
      .login-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .login-subtitle {
        color: #888;
        text-align: center;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
      }
      .login-form { display: flex; flex-direction: column; gap: 1rem; }
      .login-form .form-input { width: 100%; }
      .login-btn {
        width: 100%;
        padding: 0.75rem;
        margin-top: 0.5rem;
      }

      @media (max-width: 900px) {
        .hero { grid-template-columns: 1fr; text-align: center; padding: 3rem 1.5rem; }
        .hero-content h1 { font-size: 2.5rem; }
        .hero-visual { display: none; }
        .navbar { padding: 1rem 1.5rem; }
        .nav-links { display: none; }
        .app-container { padding: 1.5rem; }
        .stats-bar { grid-template-columns: repeat(2, 1fr); }
        .overall-card { grid-template-columns: 1fr; }
        .grade-breakdown { border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding-left: 0; padding-top: 1.5rem; margin-top: 1rem; }
        .class-stats-row { grid-template-columns: repeat(2, 1fr); }
        .assignment-row { flex-direction: column; align-items: flex-start; }
        .assignment-right { width: 100%; justify-content: space-between; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid rgba(255,255,255,0.05); }
      }

      /* AI Assistant Widget */
      .ai-widget {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        border: none;
        border-radius: 30px;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        z-index: 1000;
        transition: all 0.3s ease;
      }
      .ai-widget:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 25px rgba(139, 92, 246, 0.5);
      }
      .ai-widget.hidden { display: none; }
      .ai-widget-icon { width: 20px; height: 20px; color: white; }
      .ai-widget-icon svg { width: 20px; height: 20px; }
      .ai-widget-text { color: white; font-weight: 600; font-size: 14px; }
      
      .ai-chat-window {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 360px;
        max-width: calc(100vw - 40px);
        height: 500px;
        max-height: 70vh;
        background: rgba(20, 20, 25, 0.98);
        border: 1px solid rgba(139, 92, 246, 0.4);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        z-index: 1001;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .ai-chat-window.hidden { display: none; }
      
      .ai-chat-header {
        padding: 16px;
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .ai-chat-title {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
      }
      .ai-header-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 50%; padding: 8px; }
      .ai-header-icon svg { width: 20px; height: 20px; color: white; }
      .ai-chat-title strong { display: block; font-size: 15px; }
      .ai-chat-title small { opacity: 0.8; font-size: 12px; }
      .ai-close-btn {
        width: 32px; height: 32px;
        background: rgba(255,255,255,0.2);
        border: none; border-radius: 8px;
        color: white; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .ai-close-btn:hover { background: rgba(255,255,255,0.3); }
      .ai-close-btn svg { width: 18px; height: 18px; }
      
      .ai-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(10, 10, 15, 0.5);
      }
      
      .ai-message {
        display: flex;
        gap: 10px;
        max-width: 85%;
      }
      .ai-message-user {
        flex-direction: row-reverse;
        align-self: flex-end;
      }
      .ai-message-ai {
        align-self: flex-start;
      }
      
      .ai-avatar {
        width: 28px; height: 28px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .ai-avatar svg { width: 14px; height: 14px; color: white; }
      .ai-avatar-ai { background: linear-gradient(135deg, #8b5cf6, #3b82f6); }
      .ai-avatar-user { background: rgba(255,255,255,0.2); }
      
      .ai-bubble {
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .ai-message-ai .ai-bubble {
        background: rgba(255,255,255,0.1);
        color: #e5e7eb;
        border-bottom-left-radius: 4px;
      }
      .ai-message-user .ai-bubble {
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: white;
        border-bottom-right-radius: 4px;
      }
      
      .ai-quick {
        padding: 8px 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      .ai-quick button {
        padding: 6px 12px;
        background: rgba(139, 92, 246, 0.2);
        border: 1px solid rgba(139, 92, 246, 0.3);
        border-radius: 20px;
        color: #c4b5fd;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .ai-quick button:hover {
        background: rgba(139, 92, 246, 0.3);
        color: white;
      }
      
      .ai-input-area {
        padding: 12px 16px;
        display: flex;
        gap: 8px;
        border-top: 1px solid rgba(255,255,255,0.1);
        background: rgba(20, 20, 25, 0.8);
      }
      .ai-input-area input {
        flex: 1;
        padding: 10px 16px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 24px;
        color: white;
        font-size: 14px;
        outline: none;
      }
      .ai-input-area input:focus {
        border-color: rgba(139, 92, 246, 0.5);
      }
      .ai-input-area input::placeholder { color: rgba(255,255,255,0.4); }
      .ai-send-btn {
        width: 40px; height: 40px;
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        border: none; border-radius: 50%;
        color: white; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s;
      }
      .ai-send-btn:hover { transform: scale(1.05); }
      .ai-send-btn svg { width: 18px; height: 18px; }

      /* Timer Widget */
      .timer-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(20, 20, 25, 0.95);
        border: 1px solid rgba(139, 92, 246, 0.4);
        border-radius: 12px;
        padding: 8px 12px;
        z-index: 1000;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        transition: all 0.2s ease;
      }
      .timer-compact {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .timer-icon { width: 18px; height: 18px; color: #8b5cf6; }
      .timer-time {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
      }
      .timer-expanded {
        display: none;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      .timer-widget.expanded .timer-expanded { display: block; }
      .timer-adjust {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .timer-adjust button {
        width: 32px; height: 28px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        background: rgba(255,255,255,0.05);
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
      .timer-adjust button:hover { background: rgba(255,255,255,0.1); }
      .timer-btns {
        display: flex;
        justify-content: center;
        gap: 6px;
      }
      .timer-btns button {
        width: 32px; height: 32px;
        border: none;
        border-radius: 6px;
        background: rgba(139, 92, 246, 0.3);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .timer-btns button svg { width: 14px; height: 14px; }
      .timer-btns button:hover { background: rgba(139, 92, 246, 0.5); }
      .timer-btns button.hidden { display: none; }

      /* Timer Alert/Reminder Notification */
      .timer-alert {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        padding: 2rem 3rem;
        z-index: 3000;
        box-shadow: 0 20px 60px rgba(139, 92, 246, 0.5);
        text-align: center;
        animation: alertPop 0.4s ease-out;
      }
      @keyframes alertPop {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        70% { transform: translate(-50%, -50%) scale(1.05); }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }
      .timer-alert-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        animation: bellRing 0.5s ease-in-out infinite alternate;
      }
      @keyframes bellRing {
        0% { transform: rotate(-15deg); }
        100% { transform: rotate(15deg); }
      }
      .timer-alert h2 {
        color: #fff;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .timer-alert p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }
      .timer-alert button {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        padding: 0.75rem 2rem;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .timer-alert button:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }
      .timer-alert-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 2999;
      }

      /* Timer widget flashing when done */
      .timer-widget.timer-done {
        animation: timerFlash 0.5s ease-in-out infinite alternate;
        border-color: #f59e0b;
      }
      @keyframes timerFlash {
        0% { box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4); background: rgba(20, 20, 25, 0.95); }
        100% { box-shadow: 0 4px 30px rgba(245, 158, 11, 0.8); background: rgba(245, 158, 11, 0.2); }
      }

      /* Modal Styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 1rem;
      }
      .modal {
        background: #141418;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        max-width: 600px;
        width: 100%;
        max-height: 80vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .modal-header h2 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #fff;
        margin: 0;
      }
      .modal-close {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 8px;
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.6);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
      .modal-close svg { width: 18px; height: 18px; }
      .modal-body {
        padding: 1.5rem;
        overflow-y: auto;
      }
      .modal-content {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .feature-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 1rem;
      }
      .feature-card .feature-icon {
        display: inline-flex;
        width: 36px;
        height: 36px;
        background: rgba(139, 92, 246, 0.2);
        border-radius: 8px;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.75rem;
      }
      .feature-card .feature-icon svg { width: 20px; height: 20px; color: #8b5cf6; }
      .feature-card h3 {
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        margin: 0 0 0.5rem 0;
      }
      .feature-card p {
        font-size: 0.875rem;
        color: rgba(255,255,255,0.6);
        margin: 0;
        line-height: 1.5;
      }
      .about-content { text-align: center; }
      .about-logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 1rem;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .about-logo svg { width: 36px; height: 36px; color: #fff; }
      .about-content h3 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
        margin: 0 0 0.25rem 0;
      }
      .about-content .version {
        color: rgba(255,255,255,0.4);
        font-size: 0.875rem;
        margin-bottom: 1rem;
      }
      .about-content > p {
        color: rgba(255,255,255,0.7);
        line-height: 1.6;
        margin-bottom: 0.75rem;
      }
      .about-section {
        text-align: left;
        background: rgba(255,255,255,0.03);
        border-radius: 10px;
        padding: 1rem;
        margin-top: 0.5rem;
      }
      .about-section h4 {
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
        margin: 0 0 0.5rem 0;
      }
      .about-section p {
        font-size: 0.85rem;
        color: rgba(255,255,255,0.6);
        margin: 0;
        line-height: 1.5;
      }
      .help-section {
        background: rgba(255,255,255,0.03);
        border-radius: 10px;
        padding: 1rem;
      }
      .help-section h3 {
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        margin: 0 0 0.75rem 0;
      }
      .help-section p {
        font-size: 0.875rem;
        color: rgba(255,255,255,0.7);
        margin: 0 0 0.5rem 0;
        line-height: 1.5;
      }
      .help-section ul, .help-section ol {
        margin: 0;
        padding-left: 1.25rem;
        color: rgba(255,255,255,0.6);
        font-size: 0.875rem;
        line-height: 1.8;
      }
      .help-section li { margin-bottom: 0.25rem; }

      /* Confetti Animation */
      .confetti-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        overflow: hidden;
      }
      .confetti {
        position: absolute;
        top: -10px;
        width: 10px;
        height: 10px;
        animation: confetti-fall linear forwards;
      }
      @keyframes confetti-fall {
        0% {
          transform: translateY(0) rotate(0deg) scale(1);
          opacity: 1;
        }
        25% {
          transform: translateY(25vh) rotate(180deg) translateX(20px) scale(1);
          opacity: 1;
        }
        50% {
          transform: translateY(50vh) rotate(360deg) translateX(-20px) scale(0.9);
          opacity: 0.9;
        }
        75% {
          transform: translateY(75vh) rotate(540deg) translateX(10px) scale(0.8);
          opacity: 0.6;
        }
        100% {
          transform: translateY(100vh) rotate(720deg) translateX(-10px) scale(0.5);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
